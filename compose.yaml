services:
  image-parser:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: gpu
    image: image-parsing-server:local
    env_file:
      - path: .env
        required: false
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      IMAGE_PARSER_VLM_MODE: ${IMAGE_PARSER_VLM_MODE:-resident}
      IMAGE_PARSER_MODEL_LOAD_ON_STARTUP: ${IMAGE_PARSER_MODEL_LOAD_ON_STARTUP:-true}
      IMAGE_PARSER_MAX_CONCURRENT_GENERATIONS: ${IMAGE_PARSER_MAX_CONCURRENT_GENERATIONS:-1}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
    ports:
      - "${IMAGE_PARSER_PORT:-8000}:8000"
    volumes:
      - hf-cache:/models/huggingface
    gpus:
      - driver: nvidia
        count: 1
        capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  hf-cache:
