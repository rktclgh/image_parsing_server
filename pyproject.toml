[project]
name = "image-parsing-server"
version = "0.1.0"
description = "Internal FastAPI service for design image parsing with deterministic analysis and Gemma VLM parsing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pillow>=10.4.0,<13.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "python-multipart>=0.0.12,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
gpu = [
    "accelerate>=1.0.0,<2.0.0",
    "bitsandbytes>=0.45.0,<1.0.0",
    "torch>=2.5.0,<3.0.0",
    "transformers>=4.51.0,<5.0.0",
]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.3.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
